<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuTour Sight | Funcionários</title>

    <link rel="icon" href="../assets/images/logo-futour-sight-icone-pagina.png" type="image/png">

    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/usuario.css">
    <link rel="stylesheet" href="../assets/css/cadastro-func.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="shortcut icon" href="../assets/images/icons/favicon.png" type="image/x-icon">
</head>

<body class="body-empresa">

    <header>
        <a href="../index.html" class="logo">
            <img src="../assets/images/logo-futour-sight-branco.png" alt="Logo FuTour Sight">
            <span>FuTour Sight</span>
        </a>

        <input type="checkbox" id="menu-hamburguer">

        <label for="menu-hamburguer" class="menu-hamburguer">
            <div class="menu">
                <span class="hamburguer"></span>
            </div>
        </label>

        <div class="overlay"></div>

        <div class="links">
            <div class="usuario-infos">
                <div class="img-container">
                    <img src="../assets/images/icons/logo-FuTourSight-branco.png" alt="Imagem da empresa">
                </div>
                <span id="nomeUser"></span>
            </div>

            <nav>
                <ul>
                    <li>
                        <button onclick="redirecionarDashboard()">
                            <img src="../assets/images/icons/dashboard.png">
                            <span>Dashboard</span>
                        </button>
                    </li>

                    <li data-permissao="EMPRESA_ADMIN">
                        <button onclick="redirecionarEdicaoEmpresa()">
                            <img src="../assets/images/icons/empresa-branca.png">
                            <span>Empresa</span>
                        </button>
                    </li>

                    <li data-permissao="EMPRESA_ADMIN,EMPRESA_USER">
                        <button onclick="redirecionarPerfil()">
                            <img src="../assets/images/icons/perfil.png">
                            <span>Perfil</span>
                        </button>
                    </li>

                    <li data-permissao="EMPRESA_ADMIN">
                        <button onclick="redirecionarListFuncionario()">
                            <img src="../assets/images/icons/historico.png">
                            <span>Funcionários</span>
                        </button>
                    </li>

                    <li data-permissao="EMPRESA_ADMIN,EMPRESA_USER">
                        <button onclick="redirecionarFiltros()">
                            <img src="../assets/images/icons/filtro.png">
                            <span>Filtro</span>
                        </button>
                    </li>
                </ul>
            </nav>

            <button class="botao-sair-container" onclick="sair()">
                <img src="../assets/images/icons/sair.png">
                <span class="botao-sair">Sair</span>
            </button>
        </div>
    </header>

    <main>

        <div class="conteudo">

            <div class="titulo-pagina">
                <h1>Cadastro de Funcionário</h1>
            </div>

            <div class="empresa-container form-box-empresa">

                <h2>Dados do Funcionário</h2>

                <div class="input-fb-empresa">

                    <div class="input-container">
                        <div class="label-container">
                            <label for="nome-colab">Nome do Colaborador</label>
                            <img src="../assets/images/icons/pessoa.png">
                        </div>

                        <input type="text" id="nome-colab" placeholder="Nome Completo" oninput="onkey_nome()">

                        <div id="div_msg_nome" style="color:red; font-size:12px;"></div>
                    </div>

                    <div class="input-container">
                        <div class="label-container">
                            <label for="email-colab">E-mail do Colaborador</label>
                            <img src="../assets/images/icons/email.png">
                        </div>

                        <input type="text" id="email-colab" placeholder="E-mail" oninput="onkey_email()">

                        <div id="div_msg_email" style="color:red; font-size:12px;"></div>
                    </div>

                    <div class="input-container">
                        <div class="label-container">
                            <label for="senha-colab">Senha</label>
                            <img src="../assets/images/icons/senha.png">
                        </div>

                        <input type="password" id="senha-colab" placeholder="Senha" oninput="onkey_senha()">

                        <div id="div_msg_senha" style="color:red; font-size:12px;"></div>
                    </div>

                </div>
            </div>

            <hr>

            <div class="form-permissao">

                <div class="empresa-container form-box-empresa">

                    <h2>Dados de Configuração</h2>

                    <div class="input-fb-empresa">

                        <div class="input-container">

                            <div class="label-container">
                                <label for="nivel">Nível de Permissão</label>
                                <img src="../assets/images/icons/seguranca.png">
                            </div>

                            <div class="label-container">
                                <select id="nivel" required>
                                    <option value="">Selecione</option>
                                    <option value="2">EMPRESA_ADMIN</option>
                                    <option value="3">EMPRESA_USER</option>
                                </select>
                            </div>

                        </div>

                    </div>

                </div>

                <div class="img-container">
                    <img src="../assets/images/empresa-senha.png" class="banner-img">
                </div>

            </div>

            <div class="linha-btn">

                <div class="linha-txt">

                    <img src="../assets/images/icons/info.png">

                    <h3>
                        Após o cadastro do funcionário, um e-mail será enviado com as credenciais de acesso cadastradas.
                    </h3>

                    <div class="emp-div-btn">
                        <button id="btn-cancelar" type="button">
                            Cancelar
                        </button>

                        <button id="btn-cadastrar" type="button" class="btn-main register-btn botao-cadastrar botao">
                            Cadastrar
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <div id="toast"></div>

    <script src="../assets/js/shared/menu.js"></script>
    <script src="../assets/js/utils/redirecionamento.js"></script>
    <script src="../assets/js/utils/utils.js"></script>
    <script src="../assets/js/utils/validacoes.js"></script>
    <script src="../assets/js/shared/sessao.js"></script>
    <script src="../assets/js/pages/usuario/cadastroFuncionario.js"></script>

</body>

</html>
