<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuTour Sight | Logs</title>

    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/logs.css">

    <link rel="shortcut icon" href="../assets/images/icons/favicon.png" type="image/x-icon">
</head>

<script>
    function toggleConfig(btn) {
        const conteudo = btn.nextElementSibling;
        const seta = btn.querySelector('.config-seta');
        conteudo.classList.toggle('aberto');
        seta.classList.toggle('rotacionado');
    }
</script>

<body>
    <header>
        <a href="../index.html" class="logo">
            <img src="../assets/images/logo-futour-sight-branco.png" alt="Logo FuTour Sight">
            <span>FuTour Sight</span>
        </a>

        <input type="checkbox" id="menu-hamburguer">

        <label for="menu-hamburguer" class="menu-hamburguer">
            <div class="menu">
                <span class="hamburguer"></span>
            </div>
        </label>

        <div class="overlay"></div>

        <div class="links">
            <nav>
                <ul>
                    <li><a href="./solicitacoes.html">Solicitações</a></li>
                    <li><a href="./lista-empresas.html">Parcerias</a></li>
                    <li><a href="./logs.html">Logs</a></li>
                </ul>
            </nav>
            <div class="botoes-autenticacao">
                <a href="../login.html" class="botao botao-cadastrar">Sair</a>
            </div>
        </div>
    </header>

    <ma<section class="painel-configuracoes" id="painel-configuracoes">
        <h2>Configurações de Notificação</h2>
        <div class="config-menu">
            <div class="config-menu-item">
                <button class="config-menu-btn" onclick="toggleConfig(this)">
                    <span>Notificações</span>
                    <i class="config-seta">▾</i>
                </button>
                <div class="config-menu-conteudo">
                    <div id="lista-configuracoes"></div>
                </div>
            </div>
        </div>
        </section>

        <div>
            <div class="logs-header">
                <h2>
                    Histórico de execuções
                    <span class="badge-total" id="badge-total">0</span>
                </h2>
                <div class="filtros-log">
                    <button class="filtro-btn ativo" onclick="filtrarLogs('todos', this)">Todos</button>
                    <button class="filtro-btn" onclick="filtrarLogs('sucesso', this)">Sucesso</button>
                    <button class="filtro-btn" onclick="filtrarLogs('erro', this)">Erro</button>
                </div>
            </div>

            <div class="container">
                <div class="logs-table-header">
                    <span>Data / Hora</span>
                    <span>Mensagem</span>
                    <span>Status</span>
                </div>
                <ul class="logs" id="lista-logs"></ul>
            </div>
        </div>
        </main>

        <div id="toast"></div>

        <script src="../assets/js/utils/utils.js"></script>
        <script src="../assets/js/pages/admin/logs.js"></script>
        <script src="../assets/js/utils/redirecionamento.js"></script>

        <script>
            const paginaAtual = window.location.pathname.split("/").pop();

            document.querySelectorAll(".links nav ul li a").forEach(link => {
                const href = link.getAttribute("href");

                if (!href) return;

                const arquivoLink = href.split("/").pop();

                if (arquivoLink === paginaAtual) {
                    link.parentElement.classList.add("isAtivo");
                }
            });

            let todosOsLogs = [];

            function filtrarLogs(tipo, btn) {
                document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('ativo'));
                btn.classList.add('ativo');

                const filtrados = tipo === 'todos'
                    ? todosOsLogs
                    : todosOsLogs.filter(l => (tipo === 'sucesso' ? l.sucesso : !l.sucesso));

                renderizarLogs(filtrados);
            }

            function renderizarLogs(logs) {
                const lista = document.getElementById('lista-logs');

                if (!logs.length) {
                    lista.innerHTML = '<li class="sem-logs">Nenhum log encontrado.</li>';
                    return;
                }

                lista.innerHTML = logs.map(log => `
                <li class="log">
                    <p class="data-hora">${new Date(log.data_criacao).toLocaleString('pt-BR')}</p>
                    <p class="mensagem">${log.mensagem || '—'}</p>
                    <div class="status">
                        <span class="badge-status ${log.sucesso ? 'sucesso' : 'erro'}">
                            ${log.sucesso ? 'Sucesso' : 'Erro'}
                        </span>
                    </div>
                </li>
            `).join('');
            }

            async function carregarLogs() {
                try {
                    const res = await fetch('/adminFutour/logs');
                    todosOsLogs = await res.json();
                    document.getElementById('badge-total').textContent = todosOsLogs.length;
                    renderizarLogs(todosOsLogs);
                } catch (e) {
                    console.error(e);
                }
            }

            document.addEventListener('DOMContentLoaded', carregarLogs);
        </script>
</body>

</html>
